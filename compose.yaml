name: tp-integrador

services:
  api:
    build: .
    image: tp-integrador-api:local
    container_name: tp-integrador-api
    # Las credenciales entran al ejecutar; el .env no se copia a la imagen.
    env_file: .env
    environment:
      NODE_ENV: production
      PUERTO: "3000"
      # MySQL sigue en Windows. localhost aqui seria el propio contenedor.
      DB_HOST: host.docker.internal
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
